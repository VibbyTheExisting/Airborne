<!doctype html>
<!-- https://github.com/rafgraph/spa-github-pages -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Airborne</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
      // ----------------------------------------------------------------------
      // GitHub Pages serves this file for any path it doesn't recognize. It rewrites that path into a
      // query string and redirects to the real index.html, which unpacks it
      // back into the address bar before the app's own router reads it.
      //
      // pathSegmentsToKeep = 1 because this is a project page, so the "/Airborne"
      // segment must survive the redirect along with everything after it.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
